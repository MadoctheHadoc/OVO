project_name: ovo
checkpoint_path: null
use_wandb: False
device: cuda
data:
  frame_limit: -1 # 100 #-1 # for debugging, set to -1 to disable
seed: 0
slam:
  config_path: data/working/configs/slam
  slam_module: vanilla #orbslam #gaussian_slam #
  use_viewer: False # only used with orbslam
  close_loops: True # only used with orbslam
  save_estimated_cam: True
vis:
  stream: False
  show_stream: False # this is going to be ignored if stream is false
mapping:
  map_every: 1 # ignored if slam.slam_module == orbslam2
debug: True
debug_info: True
semantic:
  segment_every: 1
  use_gt_masks: False
  use_gt_clips: False
  match_distance_th: 0.05 #0.01
  track_th: 100
  depth_filter: True
  log: True
  sam:
    precomputed: False
    multi_crop: True
    points_per_side: 16
    sam_ckpt_path: "data/input/sam_ckpts/"
    sam_version: "2.1"
    sam_encoder: "hiera_l"
    masks_base_path: "data/working/masks/replica_384_sam2.1_16"
    #sam_version: "" # "" is 1, 
    #sam_encoder: "vit_h"
    #masks_base_path: "data/working/masks/replica_384_h"
    #nms_iou_th: 0.88
    #stability_score_thresh: 0.95
    #min_mask_region_area: 100
  clip:
    use_half: False
    embed_type: learned #TextRegion #fixed_weights # 
    model_card: SigLIP-384 #"PE-Core-L14-336" # ViT-H-14 #
    mask_res: 384 # 336 for PE Core
    weights_predictor_path: data/input/weights_predictor/base
    k_top_views: 10 #5 #10000 #-1 #
    fusion: 'l1_medoid' #'avg_pooling' #
    mv_fuser: False #True #
    mv_fuser_ckpt: "20250725_1200"
  kf_queue_delay: 10
